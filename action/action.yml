name: "llm-evalboard"
description: "Statistically honest LLM evaluation in your pull requests"
inputs:
  config:
    description: "Path to evalboard suite configuration"
    required: true
  baseline-ref:
    description: "Git ref for baseline comparison"
    required: false
    default: "main"
runs:
  using: "node20"
  main: "dist/index.js"

